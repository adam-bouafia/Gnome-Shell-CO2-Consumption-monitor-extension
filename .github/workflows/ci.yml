name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin jq zip

      - name: Validate metadata.json
        run: |
          jq -e '.uuid and .name and .description and (.["shell-version"] | length > 0)' metadata.json

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas/

      - name: Check JavaScript syntax
        run: |
          for f in *.js lib/*.js; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Build zip
        run: scripts/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: shell-extension
          path: '*.shell-extension.zip'
