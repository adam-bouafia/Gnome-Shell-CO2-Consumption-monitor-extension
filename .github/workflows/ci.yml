name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin jq zip

      - name: Validate metadata.json
        run: |
          jq -e '.uuid and .name and .description and (.["shell-version"] | length > 0)' metadata.json

      - name: Validate GSettings schema
        run: glib-compile-schemas --strict --dry-run schemas/

      - name: Check JavaScript syntax
        run: |
          for f in *.js lib/*.js; do
            node --input-type=module --check < "$f" || { echo "::error file=$f::syntax error"; exit 1; }
          done

      - name: Build zip
        run: scripts/pack.sh

      # EGO's own linter. Report-only: it still flags GNOME 51 as a future release.
      # tree-sitter 0.26 segfaults with tree-sitter-javascript 0.25, hence the pin.
      - name: Lint with shexli
        run: |
          python3 -m venv /tmp/shexli
          /tmp/shexli/bin/pip install -q "tree-sitter==0.25.*" \
            "shexli @ git+https://gitlab.gnome.org/Infrastructure/extensions-web.git@064941f925713ca282b5d8507e750bc9a1fb209f#subdirectory=shexli"
          /tmp/shexli/bin/shexli --format json *.shell-extension.zip > shexli.json || true
          jq -r '.findings[] | .evidence[0] as $e
            | "::\(if .severity == "error" then "error" else "warning" end) file=\($e.path | sub("^[^:]*:"; "")),line=\($e.line // 1),title=\(.rule_id)::\(.title)"' shexli.json

      - uses: actions/upload-artifact@v4
        with:
          name: shell-extension
          path: '*.shell-extension.zip'
